<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo ID Frontend</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --ink: #18202f;
            --muted: #667085;
            --line: #d8dee8;
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --green: #1f9d68;
            --amber: #b97916;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background:
                linear-gradient(180deg, #eef3fb 0%, #f8fafc 42%, #eef2f6 100%);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        .app-shell {
            margin: 0 auto;
            max-width: 1120px;
            padding: 32px 20px 44px;
        }

        .topbar {
            align-items: center;
            display: flex;
            gap: 18px;
            justify-content: space-between;
            margin-bottom: 34px;
        }

        .brand {
            display: grid;
            gap: 4px;
        }

        .brand h1 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            letter-spacing: 0;
            line-height: 1;
            margin: 0;
        }

        .brand p {
            color: var(--muted);
            font-size: 1rem;
            margin: 0;
        }

        .repo-path {
            background: #e8edf6;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: #344054;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 0.86rem;
            padding: 9px 12px;
            white-space: nowrap;
        }

        .usecase-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .usecase-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 20px 44px rgba(25, 40, 65, 0.08);
            color: var(--ink);
            display: grid;
            gap: 18px;
            min-height: 250px;
            overflow: hidden;
            padding: 20px;
            text-decoration: none;
            transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }

        .usecase-card:focus-visible,
        .usecase-card:hover {
            border-color: rgba(37, 99, 235, 0.5);
            box-shadow: 0 24px 56px rgba(25, 40, 65, 0.14);
            outline: 0;
            transform: translateY(-2px);
        }

        .preview {
            align-items: center;
            background:
                linear-gradient(135deg, rgba(37, 99, 235, 0.12), transparent 42%),
                linear-gradient(315deg, rgba(31, 157, 104, 0.12), transparent 45%),
                #f1f5f9;
            border: 1px solid #e4e9f2;
            border-radius: 8px;
            display: flex;
            height: 120px;
            justify-content: center;
            overflow: hidden;
        }

        .preview.beerkart {
            background:
                linear-gradient(135deg, rgba(185, 121, 22, 0.18), transparent 46%),
                #18130d;
        }

        .preview.nuvex {
            background:
                linear-gradient(135deg, rgba(37, 99, 235, 0.18), transparent 46%),
                #07111f;
        }

        .preview img {
            display: block;
            max-height: 82px;
            max-width: 72%;
            object-fit: contain;
        }

        .card-content {
            display: grid;
            gap: 12px;
        }

        .card-row {
            align-items: start;
            display: flex;
            gap: 14px;
            justify-content: space-between;
        }

        .card-content h2 {
            font-size: 1.4rem;
            line-height: 1.15;
            margin: 0;
        }

        .card-content p {
            color: var(--muted);
            line-height: 1.5;
            margin: 0;
        }

        .open-pill {
            align-items: center;
            background: var(--blue);
            border-radius: 8px;
            color: #ffffff;
            display: inline-flex;
            flex: 0 0 auto;
            font-weight: 800;
            gap: 8px;
            justify-content: center;
            min-height: 38px;
            padding: 9px 12px;
        }

        .path {
            color: #475467;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 0.9rem;
            overflow-wrap: anywhere;
        }

        .status-row {
            align-items: center;
            color: var(--muted);
            display: flex;
            font-size: 0.95rem;
            gap: 10px;
            margin-top: 18px;
        }

        .status-dot {
            background: var(--green);
            border-radius: 999px;
            display: inline-block;
            height: 9px;
            width: 9px;
        }

        [v-cloak] {
            display: none;
        }

        @media (max-width: 760px) {
            .app-shell {
                padding: 24px 14px 34px;
            }

            .topbar {
                align-items: stretch;
                display: grid;
                margin-bottom: 22px;
            }

            .repo-path {
                white-space: normal;
            }

            .usecase-grid {
                grid-template-columns: 1fr;
            }

            .card-row {
                display: grid;
            }

            .open-pill {
                justify-self: start;
            }
        }
    </style>
</head>

<body>
    <div id="app" v-cloak>
        <main class="app-shell">
            <header class="topbar">
                <div class="brand">
                    <h1>Demo ID Frontend</h1>
                    <p>Available ID use cases</p>
                </div>
                <div class="repo-path">{{ displayBasePath }}</div>
            </header>

            <section class="usecase-grid" aria-label="Available ID use cases">
                <a
                    v-for="usecase in usecases"
                    :key="usecase.slug"
                    class="usecase-card"
                    :href="usecase.href"
                >
                    <div class="preview" :class="usecase.slug">
                        <img :src="usecase.logo" :alt="`${usecase.name} logo`">
                    </div>
                    <div class="card-content">
                        <div class="card-row">
                            <div>
                                <h2>{{ usecase.name }}</h2>
                                <p>{{ usecase.summary }}</p>
                            </div>
                            <span class="open-pill">Open</span>
                        </div>
                        <div class="path">{{ usecase.href }}</div>
                    </div>
                </a>
            </section>

            <div class="status-row">
                <span class="status-dot" aria-hidden="true"></span>
                <span>{{ usecases.length }} use cases listed</span>
            </div>
        </main>
    </div>

    <script>
        const { createApp, computed } = Vue;

        createApp({
            setup() {
                const currentPath = window.location.pathname.replace(/\/index\.html$/, "/");
                const basePath = currentPath.endsWith("/") ? currentPath : `${currentPath}/`;
                const usecases = [
                    {
                        name: "BeerKart",
                        slug: "beerkart",
                        summary: "Age-aware beer marketplace checkout demo.",
                        logo: `${basePath}beerkart/assets/logo-beerkart.png`,
                    },
                    {
                        name: "NuVex",
                        slug: "nuvex",
                        summary: "Identity-gated exchange trading demo.",
                        logo: `${basePath}nuvex/assets/logo.png`,
                    },
                ].map((usecase) => ({
                    ...usecase,
                    href: `${basePath}${usecase.slug}/`,
                }));

                const displayBasePath = computed(() => basePath);

                return {
                    displayBasePath,
                    usecases,
                };
            },
        }).mount("#app");
    </script>
</body>

</html>
