name: Implement ADR

on:
  repository_dispatch:
    types: [implement-adr]

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save Received ADR Content to File
        env:
          ADR_CONTENT: ${{ github.event.client_payload.adr_content }}
          ADR_FILENAME: ${{ github.event.client_payload.adr_filename }}
        run: |
          mkdir -p docs/adr
          printf '%s\n' "$ADR_CONTENT" > "docs/adr/$ADR_FILENAME"

      - name: Run Aider Implementation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADR_FILENAME: ${{ github.event.client_payload.adr_filename }}
        run: |
          aider --architect --yes --message "Implement the architectural changes specified in docs/adr/$ADR_FILENAME"

      - name: Push Changes
        run: |
          git push origin develop