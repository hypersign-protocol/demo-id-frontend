name: Implement ADR (OpenHands)

on:
  repository_dispatch:
    types: [implement-adr]
  workflow_dispatch:
    inputs:
      adr_filename:
        description: 'ADR Filename'
        required: true
        default: '0001-example-adr.md'
      adr_content:
        description: 'ADR Content'
        required: true

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenHands CLI
        run: |
          python -m pip install --upgrade pip
          pip install openhands-ai

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save Received ADR Content to File
        env:
          ADR_CONTENT: ${{ github.event.client_payload.adr_content || inputs.adr_content }}
          ADR_FILENAME: ${{ github.event.client_payload.adr_filename || inputs.adr_filename }}
        run: |
          mkdir -p docs/adr
          printf '%s\n' "$ADR_CONTENT" > "docs/adr/$ADR_FILENAME"

      - name: Prepare Task Prompt File
        env:
          ADR_FILENAME: ${{ github.event.client_payload.adr_filename || inputs.adr_filename }}
        run: |
          cat <<EOF > task.txt
          1. Read docs/adr/$ADR_FILENAME carefully.
          2. Inspect existing components, code structure, and styling in the repository.
          3. Implement all technical specifications and functional logic detailed in the ADR.
          4. Run project build and test commands (e.g., npm run build, npm test, or pytest) to verify execution.
          5. If any build or test errors occur, analyze logs and edit code until all checks pass cleanly.
          EOF

      - name: Run OpenHands Agent Implementation
        env:
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: "openai/gpt-4o"
        run: |
          openhands --headless --override-with-envs -f task.txt

      - name: Create Pull Request to develop
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: feat/implement-${{ github.event.client_payload.adr_filename || inputs.adr_filename }}
          base: develop
          title: "feat(adr): implement ${{ github.event.client_payload.adr_filename || inputs.adr_filename }}"
          body: |
            ## Automated ADR Implementation (OpenHands)
            This PR was automatically generated by OpenHands running in headless mode based on the received Architectural Decision Record.

            **ADR File:** `docs/adr/${{ github.event.client_payload.adr_filename || inputs.adr_filename }}`
          labels: |
            automated-pr
            adr-implementation