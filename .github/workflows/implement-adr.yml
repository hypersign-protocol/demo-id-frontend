name: Implement ADR (OpenHands)

on:
  repository_dispatch:
    types: [implement-adr]
  workflow_dispatch:
    inputs:
      adr_filename:
        description: 'ADR Filename'
        required: true
        default: '0001-example-adr.md'
      adr_content:
        description: 'ADR Content'
        required: true

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save Received ADR Content to File
        env:
          ADR_CONTENT: ${{ github.event.client_payload.adr_content || inputs.adr_content }}
          ADR_FILENAME: ${{ github.event.client_payload.adr_filename || inputs.adr_filename }}
        run: |
          mkdir -p docs/adr
          printf '%s\n' "$ADR_CONTENT" > "docs/adr/$ADR_FILENAME"

      - name: Prepare Task Prompt File
        env:
          ADR_FILENAME: ${{ github.event.client_payload.adr_filename || inputs.adr_filename }}
        run: |
          cat <<EOF > task.txt
          You are an expert software developer tasked with executing an Architectural Decision Record (ADR).

          PHASE 1: ADR ANALYSIS & SCOPE IDENTIFICATION
          1. Read and thoroughly analyze 'docs/adr/$ADR_FILENAME'.
          2. Determine the scope of the decision (e.g., creating a new module/feature, adding unit/e2e test suites, refactoring existing code, or updating configuration/CI pipelines).

          PHASE 2: REPOSITORY EXPLORATION
          3. Explore the repository to understand existing patterns relevant to this specific task:
             - If creating code/features: Inspect existing modules for directory conventions, architecture, and dynamic behavior.
             - If writing tests: Inspect existing test setups, test framework configurations, directory structures, and mocking patterns.
             - If refactoring/modifying: Inspect the target files, their dependents, and existing integration points.

          PHASE 3: IMPLEMENTATION & VERIFICATION
          4. Execute the changes described in the ADR adhering to the project's established conventions and standards.
          5. Ensure all implementation details are fully functional—no placeholders, dummy code, or dead stubs.
          6. Verify your work (e.g., run existing/new tests, verify syntax, ensure no broken imports) before completing.
          7. Call the 'finish' tool once the task is complete.
          EOF

      - name: Run OpenHands Agent Image
        env:
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: "openai/gpt-4o"
          WORKSPACE_BASE: ${{ github.workspace }}
          MAX_ITERATIONS: 30
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e LLM_API_KEY="$LLM_API_KEY" \
            -e LLM_MODEL="$LLM_MODEL" \
            -e MAX_ITERATIONS="$MAX_ITERATIONS" \
            -e WORKSPACE_MOUNT_PATH="$WORKSPACE_BASE" \
            -e SANDBOX_USER_ID=0 \
            -e DISABLE_MICROAGENTS=true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$WORKSPACE_BASE":/opt/workspace_base \
            ghcr.io/all-hands-ai/openhands:main \
            python -m openhands.core.main -t "$(cat task.txt)"

      - name: Fix workspace permissions
        if: always()
        run: |
          sudo chown -R $(whoami):$(id -ng) .
          rm -f task.txt

      - name: Create Pull Request to develop
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.MULTI_REPO_PAT }}
          branch: feat/implement-${{ github.event.client_payload.adr_filename || inputs.adr_filename }}
          base: develop
          title: "feat(adr): implement ${{ github.event.client_payload.adr_filename || inputs.adr_filename }}"
          body: |
            ## Automated ADR Implementation (OpenHands)
            This PR was automatically generated by OpenHands running in headless mode based on the received Architectural Decision Record.
            
            **ADR File:** `docs/adr/${{ github.event.client_payload.adr_filename || inputs.adr_filename }}`
          labels: |
            automated-pr
            adr-implementation