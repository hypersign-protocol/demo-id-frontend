name: Implement ADR

on:
  repository_dispatch:
    types: [implement-adr]
  workflow_dispatch:
    inputs:
      adr_filename:
        description: 'ADR Filename'
        required: true
        default: '0001-example-adr.md'
      adr_content:
        description: 'ADR Content'
        required: true

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save Received ADR Content to File
        env:
          ADR_CONTENT: ${{ github.event.client_payload.adr_content || inputs.adr_content }}
          ADR_FILENAME: ${{ github.event.client_payload.adr_filename || inputs.adr_filename }}
        run: |
          mkdir -p docs/adr
          printf '%s\n' "$ADR_CONTENT" > "docs/adr/$ADR_FILENAME"

      - name: Run Aider Implementation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADR_FILENAME: ${{ github.event.client_payload.adr_filename || inputs.adr_filename }}
        run: |
          # Dynamically collect all existing project source files while ignoring git/node_modules
          FILES=$(find src usecases config.js index.html -type f 2>/dev/null | tr '\n' ' ')

          aider \
            --yes \
            --no-auto-commits \
            --read "docs/adr/$ADR_FILENAME" \
            --message "Analyze and implement all requirements, specifications, and tasks defined in docs/adr/$ADR_FILENAME. Update existing code, add unit tests, or create new files as requested by the document." \
            $FILES

      - name: Create Pull Request to develop
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: feat/implement-${{ github.event.client_payload.adr_filename || inputs.adr_filename }}
          base: develop
          title: "feat(adr): implement ${{ github.event.client_payload.adr_filename || inputs.adr_filename }}"
          body: |
            ## Automated ADR Implementation
            This PR was automatically generated by Aider based on the received Architectural Decision Record.
            
            **ADR File:** `docs/adr/${{ github.event.client_payload.adr_filename || inputs.adr_filename }}`
          labels: |
            automated-pr
            adr-implementation