name: AI Agent Implementation

on:
  repository_dispatch:
    types: [implement-adr] # Listens for dispatch from central repo

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Set up Python & Aider AI Agent
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider Agent
        run: pip install aider-chat

      - name: Create ADR Spec File & Feature Branch
        run: |
          mkdir -p docs/adr
          echo "${{ github.event.client_payload.adr_content }}" > "docs/adr/${{ github.event.client_payload.adr_filename }}"
          
          BRANCH_NAME="feat/${{ github.event.client_payload.adr_filename }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

      - name: Run AI Agent Execution Loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ADR_FILE="docs/adr/${{ github.event.client_payload.adr_filename }}"
          
          # Aider reads ADR spec, modifies code, writes unit tests, and loops npm test until green
          aider \
            --message "Read $ADR_FILE. Implement required code and tests according to specifications." \
            --test-cmd "npm test" \
            --auto-test \
            --yes-always

      - name: Push Branch and Raise GitHub PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="feat/${{ github.event.client_payload.adr_filename }}"
          git push origin "$BRANCH_NAME" --force
          
          gh pr create \
            --title "AI Auto-Impl: ${{ github.event.client_payload.adr_filename }}" \
            --body "Automated PR created by AI Coding Agent from ADR spec. All unit tests green." \
            --base develop \
            --head "$BRANCH_NAME"